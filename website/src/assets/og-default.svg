<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Background: brand dark green gradient -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08553D"/>
      <stop offset="1" stop-color="#062E21"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1D9E75"/>
      <stop offset="1" stop-color="#0E7C5A"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative chart bars (right side) -->
  <g opacity="0.35">
    <rect x="760" y="210" width="26" height="120" rx="8" fill="#1D9E75"/>
    <rect x="800" y="150" width="26" height="180" rx="8" fill="#34D399"/>
    <rect x="840" y="240" width="26" height="90" rx="8" fill="#1D9E75"/>
    <rect x="880" y="120" width="26" height="210" rx="8" fill="#34D399"/>
    <rect x="920" y="180" width="26" height="150" rx="8" fill="#1D9E75"/>
    <rect x="960" y="90" width="26" height="240" rx="8" fill="#34D399"/>
    <rect x="1000" y="200" width="26" height="130" rx="8" fill="#1D9E75"/>
    <rect x="1040" y="140" width="26" height="190" rx="8" fill="#34D399"/>
  </g>

  <!-- KPI card mockup -->
  <g transform="translate(700 330)">
    <rect x="0" y="0" width="330" height="120" rx="16" fill="#FFFFFF" fill-opacity="0.08"/>
    <rect x="24" y="24" width="60" height="16" rx="8" fill="#34D399"/>
    <rect x="24" y="52" width="160" height="24" rx="12" fill="#FFFFFF" fill-opacity="0.85"/>
    <rect x="24" y="86" width="90" height="10" rx="5" fill="#FFFFFF" fill-opacity="0.35"/>
  </g>

  <!-- Logo mark -->
  <g transform="translate(80 78)">
    <rect width="64" height="64" rx="16" fill="url(#accent)"/>
    <text x="32" y="46" font-family="DejaVu-Sans-Bold" font-size="36" fill="#FFFFFF" text-anchor="middle">L</text>
  </g>

  <!-- Wordmark -->
  <text x="164" y="116" font-family="DejaVu-Sans-Bold" font-size="52" fill="#FFFFFF">Ledgr<span fill="#34D399">.</span></text>

  <!-- Headline -->
  <text x="80" y="210" font-family="DejaVu-Sans-Bold" font-size="58" fill="#FFFFFF">Accounting that speaks Kwacha</text>

  <!-- Tagline -->
  <text x="80" y="280" font-family="DejaVu-Sans" font-size="30" fill="#A7F3D0">MWK-first accounting, invoicing, payroll &amp; inventory for Malawian SMEs</text>

  <!-- Trust chips -->
  <g font-family="DejaVu-Sans" font-size="22" fill="#A7F3D0">
    <rect x="80" y="330" width="240" height="46" rx="23" fill="#FFFFFF" fill-opacity="0.1"/>
    <text x="200" y="359" text-anchor="middle">Works offline</text>
    <rect x="340" y="330" width="210" height="46" rx="23" fill="#FFFFFF" fill-opacity="0.1"/>
    <text x="445" y="359" text-anchor="middle">MRA-ready</text>
    <rect x="570" y="330" width="190" height="46" rx="23" fill="#FFFFFF" fill-opacity="0.1"/>
    <text x="665" y="359" text-anchor="middle">Free to start</text>
  </g>

  <!-- Footer bar -->
  <rect x="0" y="590" width="1200" height="40" fill="#062E21"/>
  <text x="80" y="616" font-family="DejaVu-Sans" font-size="20" fill="#6EE7B7">ledgr.com</text>
</svg>
