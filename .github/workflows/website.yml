name: Website CI

# Builds and verifies the marketing website (website/) whenever it changes.
# Runs only on paths that affect the site, so app-only changes skip it.
# The site itself deploys as its own Vercel project (rootDirectory: website)
# — this job is the pre-merge safety net.

on:
  pull_request:
    branches: ["main"]
    paths:
      - "website/**"
      - ".github/workflows/website.yml"
  push:
    branches: ["main"]
    paths:
      - "website/**"
      - ".github/workflows/website.yml"

permissions:
  contents: read

concurrency:
  group: website-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build marketing website
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        working-directory: website
        run: npm ci

      - name: Build
        working-directory: website
        run: npm run build
