name: Deploy Supabase

on:
  workflow_dispatch:
    inputs:
      deploy_migrations:
        description: Apply outstanding database migrations
        required: true
        default: true
        type: boolean
      deploy_functions:
        description: Deploy Ledgr Edge Functions
        required: true
        default: true
        type: boolean
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
      - '.github/workflows/deploy-supabase.yml'

permissions:
  contents: read

concurrency:
  group: supabase-production
  cancel-in-progress: false

jobs:
  migrations:
    name: Apply database migrations
    if: github.event_name == 'push' || inputs.deploy_migrations
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.0

      - name: Validate deployment configuration
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || {
            echo "Missing SUPABASE_ACCESS_TOKEN repository secret."
            exit 1
          }
          test -n "$SUPABASE_PROJECT_REF" || {
            echo "Missing SUPABASE_PROJECT_REF repository variable."
            exit 1
          }
          test -n "$SUPABASE_DB_PASSWORD" || {
            echo "Missing SUPABASE_DB_PASSWORD repository secret."
            exit 1
          }

      - name: Link production project
        run: |
          supabase link \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --password "$SUPABASE_DB_PASSWORD"

      - name: Apply migrations
        run: supabase db push

  functions:
    name: Deploy Edge Functions
    if: github.event_name == 'push' || inputs.deploy_functions
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.0

      - name: Validate deployment configuration
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || {
            echo "Missing SUPABASE_ACCESS_TOKEN repository secret."
            exit 1
          }
          test -n "$SUPABASE_PROJECT_REF" || {
            echo "Missing SUPABASE_PROJECT_REF repository variable."
            exit 1
          }

      - name: Deploy Edge Functions
        run: |
          for function in \
            suggest-bank-matches \
            send-invoice \
            invoice-open \
            process-invoice-automation
          do
            supabase functions deploy "$function" \
              --project-ref "$SUPABASE_PROJECT_REF"
          done
