name: Deploy

# ---------------------------------------------------------------------------
# Deployment pipeline
#
#   * push to `main`           -> deploy to STAGING (automatic)
#   * push of a tag `v*`       -> deploy to PRODUCTION (manual approval gate)
#   * workflow_dispatch        -> manual re-deploy of staging or production
#
# Production uses a GitHub Environment named `Production` that has a "Required
# reviewers" protection rule, which gives the manual approval gate the prompt
# asks for. Configure it under Settings > Environments in the repo
# (see DEPLOYMENT.md).
#
# What gets deployed on each environment:
#   1. Frontend  -> Vercel (staging = production deploy of staging project, production = --prod)
#   2. Backend   -> Supabase Edge Functions + DB migrations + function secrets
#                   (separate staging and production Supabase projects)
#   3. Optional  -> Containerised Express gateway to Railway, if RAILWAY_TOKEN
#                   is configured (see server/ and DEPLOYMENT.md)
# ---------------------------------------------------------------------------

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      environment:
        description: Which environment to deploy
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  # Shared Vercel org; project id is swapped per environment below.
  VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}

jobs:
  # =========================================================================
  # STAGING — automatic on merge to main (and manual dispatch)
  # =========================================================================
  deploy-staging:
    name: Deploy to staging
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.environment == 'staging')
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}
    env:
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID_STAGING }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      FRONTEND_LIVE_URL: ${{ vars.STAGING_URL }}

      # Frontend build-time env (staging Supabase project)
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL_STAGING }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY_STAGING }}
      VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN_STAGING }}
      # Org capability kill switch; default OFF until the gated rollout opts in.
      VITE_FEATURE_CAPABILITY_ORG_LAYER: ${{ vars.VITE_FEATURE_CAPABILITY_ORG_LAYER_STAGING || 'false' }}

      # Sentry source-map upload (frontend)
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ vars.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT_STAGING }}

      # Supabase staging project
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF_STAGING }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD_STAGING }}
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      # Used only to name the missing secret in pre-flight error messages.
      SUPABASE_SECRET_SUFFIX: STAGING
      SUPABASE_ENV_LABEL: staging
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      # IC 2026-09-25 P9: the DB migration this commit expects (verified on the
      # remote before the frontend ships; embedded in /version.json).
      - name: Record migration target
        run: echo "MIGRATION_TARGET=$(node scripts/ci/migration-target.mjs)" >> "$GITHUB_ENV"
      - name: Build frontend
        id: build
        run: npm run build
      - name: Deploy Supabase backend (staging)
        uses: supabase/setup-cli@v3
        with:
          version: 2.109.0
      - name: Verify Supabase credentials are configured (staging)
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || {
            echo "::error::SUPABASE_ACCESS_TOKEN is not configured. Add it under Settings -> Secrets and variables -> Actions."
            exit 1
          }
          test -n "$SUPABASE_PROJECT_REF" || {
            echo "::error::SUPABASE_PROJECT_REF_${SUPABASE_SECRET_SUFFIX} is not configured. Add it under Settings -> Secrets and variables -> Actions -> Variables."
            exit 1
          }
          test -n "$SUPABASE_DB_PASSWORD" || {
            echo "::error::SUPABASE_DB_PASSWORD_${SUPABASE_SECRET_SUFFIX} is not configured. Add the ${SUPABASE_ENV_LABEL} Supabase database password under Settings -> Secrets and variables -> Actions."
            exit 1
          }
          if [[ "$SUPABASE_DB_PASSWORD" == *$'\n'* || "$SUPABASE_DB_PASSWORD" == *$'\r'* ]]; then
            echo "::error::SUPABASE_DB_PASSWORD_${SUPABASE_SECRET_SUFFIX} must not contain a newline."
            exit 1
          fi
          echo "Supabase deployment credentials for ${SUPABASE_ENV_LABEL} are configured."
      # ORDER MATTERS: the database is migrated (and the functions deployed)
      # BEFORE the frontend goes live. The client writes columns and calls
      # functions that only exist after `supabase db push` — e.g.
      # journal_entries.posting_key, added by 20260921000000 — so shipping it
      # first leaves a window where new code writes against an old schema.
      # Backend-first is the safe direction: the migrations are additive, so
      # the running (old) client keeps working throughout the rollout.
      # IC 2026-09-25 P9: fail BEFORE the irreversible DB migration when the
      # frontend cannot possibly be deployed (missing/invalid Vercel token or
      # project). On 2026-09-24 the backend shipped and Vercel then failed,
      # leaving ~23.5 h of new-backend/old-frontend skew.
      - name: Pre-flight frontend deploy credentials (staging)
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}" || { echo "::error::VERCEL_TOKEN is not configured; refusing to migrate the database without a deployable frontend."; exit 1; }
          test -n "${VERCEL_PROJECT_ID:-}" || { echo "::error::Vercel project id for staging is not configured; refusing to migrate."; exit 1; }
          test -n "${VERCEL_ORG_ID:-}" || { echo "::error::VERCEL_ORG_ID is not configured; refusing to migrate."; exit 1; }
          test -n "${FRONTEND_LIVE_URL:-}" || { echo "::error::STAGING_URL is not configured; refusing to migrate without a verifiable live frontend URL."; exit 1; }
          [[ "$FRONTEND_LIVE_URL" == https://* ]] || { echo "::error::STAGING_URL must be an https URL."; exit 1; }
          npm i -g vercel@latest >/dev/null 2>&1
          if ! vercel whoami --token "$VERCEL_TOKEN" >/dev/null 2>&1; then
            echo "::error::Vercel token rejected (vercel whoami failed); refusing to migrate the database."
            exit 1
          fi
          # Link the exact staging project before the irreversible DB step.
          # Without .vercel/project.json the CLI can deploy to an unintended
          # default project, while still returning exit code 0.
          if ! vercel link --yes --project "$VERCEL_PROJECT_ID" --scope "$VERCEL_ORG_ID" --token "$VERCEL_TOKEN"; then
            echo "::error::Could not link the configured staging Vercel project; refusing to migrate."
            exit 1
          fi
          # Pull this project's production settings now, so the later local
          # Build Output API artifact is generated for the exact linked project.
          if ! vercel pull --yes --environment=production --scope "$VERCEL_ORG_ID" --token "$VERCEL_TOKEN"; then
            echo "::error::Could not pull staging Vercel project settings; refusing to migrate."
            exit 1
          fi
          # Build and validate the exact release artifact before touching the DB.
          export VITE_APP_VERSION="$GITHUB_SHA"
          export VITE_MIGRATION_TARGET="$MIGRATION_TARGET"
          vercel_build_log="$(mktemp)"
          set +e
          vercel build --prod --scope "$VERCEL_ORG_ID" --token "$VERCEL_TOKEN" 2>&1 | tee "$vercel_build_log"
          vercel_build_status=${PIPESTATUS[0]}
          set -e
          if [[ "$vercel_build_status" -ne 0 ]]; then
            echo "::error::Vercel staging build failed before database migration (exit ${vercel_build_status})."
            tail -n 8 "$vercel_build_log" | while IFS= read -r line; do
              line="${line//$VERCEL_TOKEN/***}"
              line="${line//$VITE_SUPABASE_ANON_KEY/***}"
              [[ -z "$line" ]] || echo "::error::${line//::/: :}"
            done
            exit "$vercel_build_status"
          fi
          version_file=".vercel/output/static/version.json"
          [[ -s "$version_file" ]] || { echo "::error::Vercel build did not produce ${version_file}; refusing to migrate."; exit 1; }
          if ! version_values="$(node -e 'const fs=require("node:fs");const v=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));console.log(v.commit ?? "", v.migrationTarget ?? "")' "$version_file")"; then
            echo "::error::Vercel build produced invalid version.json; refusing to migrate."
            exit 1
          fi
          read -r built_commit built_target <<< "$version_values"
          if [[ "$built_commit" != "$GITHUB_SHA" || "$built_target" != "$MIGRATION_TARGET" ]]; then
            echo "::error::Vercel build artifact has commit=${built_commit} migrationTarget=${built_target}; expected ${GITHUB_SHA} / ${MIGRATION_TARGET}. Refusing to migrate."
            exit 1
          fi
          echo "Vercel credentials valid; linked staging project ${VERCEL_PROJECT_ID}; prebuilt artifact verified."
      - name: Link & migrate staging database
        id: migrate
        shell: bash
        # Retries link + push (transient pooler timeouts) and fails fast with an
        # actionable error when the project is paused/unresponsive. See script.
        run: bash scripts/ci/supabase-link-and-push.sh
      - name: Verify DB reached migration target (staging)
        id: verify_migration
        shell: bash
        run: bash scripts/ci/verify-migration-target.sh
      - name: Set Edge Function secrets (staging)
        run: |
          supabase secrets set \
            SB_ENV="staging" \
            SENTRY_DSN="${{ secrets.SENTRY_DSN_BACKEND_STAGING }}" \
            SENDGRID_API_KEY="${{ secrets.SENDGRID_API_KEY_STAGING }}" \
            SENDGRID_FROM_EMAIL="${{ secrets.SENDGRID_FROM_EMAIL_STAGING }}" \
            ANTHROPIC_API_KEY="${{ secrets.ANTHROPIC_API_KEY_STAGING }}" \
            PAYCHANGU_SECRET_KEY="${{ secrets.PAYCHANGU_SECRET_KEY_STAGING }}" \
            PAYCHANGU_WEBHOOK_SECRET="${{ secrets.PAYCHANGU_WEBHOOK_SECRET_STAGING }}" \
            INVOICE_TRACKING_SECRET="${{ secrets.INVOICE_TRACKING_SECRET_STAGING }}" \
            ALLOWED_ORIGINS="${{ vars.ALLOWED_ORIGINS_STAGING }}" \
            APP_URL="${{ vars.APP_URL_STAGING }}" \
            CRON_SECRET="${{ secrets.CRON_SECRET_STAGING }}" \
            --project-ref "$SUPABASE_PROJECT_REF"
      - name: Deploy Edge Functions (staging)
        id: edge
        run: |
          # Functions that handle their own JWT/auth verification and must not
          # be blocked at the Supabase gateway. Deploying without this flag causes
          # CORS preflight to be rejected -> "Failed to fetch" in the browser.
          # All functions in this repo either verify JWT themselves, are public
          # (invoice-open, accept-invite-link), or are cron/webhook entry points.
          # Deploying all with --no-verify-jwt is the safest default and matches
          # the current Supabase recommendation for custom-auth functions.
          NO_VERIFY_FUNCTIONS="api invoice-open initiate-subscription-payment verify-subscription-payment grant-manual-subscription paychangu-webhook expire-subscriptions send-renewal-reminders generate-vat-returns generate-partner-invoices finalize-account-deletions retry-failed-webhooks process-invoice-automation ai-chat support-agent suggest-bank-matches accept-invite-link create-invite-link invite-team-member list-team-members create-api-key cancel-account-deletion request-account-deletion export-my-data send-invoice webhook-dispatcher"
          for dir in supabase/functions/[a-z]*/; do
            fn="$(basename "$dir")"
            echo "Deploying function: $fn"
            if echo "$NO_VERIFY_FUNCTIONS" | grep -qw "$fn"; then
              supabase functions deploy "$fn" --no-verify-jwt --project-ref "$SUPABASE_PROJECT_REF"
            else
              supabase functions deploy "$fn" --no-verify-jwt --project-ref "$SUPABASE_PROJECT_REF"
            fi
          done
      # The schedule migrations ship literal <PROJECT_REF>/<CRON_SECRET>
      # placeholders that `db push` applies verbatim, so the HTTP-dispatched
      # cron jobs silently posted to a non-resolving host (renewal reminders
      # and partner invoices never ran). This substitutes the real values and
      # fails the deploy if any job is still holding a placeholder.
      - name: Reschedule pg_cron jobs with real URLs (staging)
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET_STAGING }}
        run: bash scripts/ci/apply-cron-jobs.sh
      - name: Deploy Express gateway to Railway (if configured)
        if: env.RAILWAY_TOKEN != ''
        env:
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID_STAGING }}
        run: |
          npm i -g @railway/cli
          railway up --service ledgr-gateway --environment staging

      # Backend compatibility-critical steps must succeed before this deploy,
      # but independent maintenance (pg_cron / optional Railway) must not strand
      # users on the previous frontend after the DB and functions have shipped.
      - name: Deploy frontend to Vercel (staging)
        id: frontend
        if: >-
          ${{ always() && !cancelled() &&
              steps.build.outcome == 'success' &&
              steps.migrate.outcome == 'success' &&
              steps.verify_migration.outcome == 'success' &&
              steps.edge.outcome == 'success' }}
        run: |
          set -euo pipefail
          deploy_stdout="$(mktemp)"
          deploy_stderr="$(mktemp)"
          set +e
          vercel deploy --prebuilt \
            --prod \
            --token "$VERCEL_TOKEN" \
            --scope "$VERCEL_ORG_ID" \
            --yes \
            --json \
            --force \
            >"$deploy_stdout" 2>"$deploy_stderr"
          deploy_status=$?
          set -e
          if [[ -s "$deploy_stderr" ]]; then
            cat "$deploy_stderr"
          fi
          if [[ "$deploy_status" -ne 0 ]]; then
            echo "::error::vercel deploy --prebuilt (staging) failed (exit ${deploy_status})"
            cat "$deploy_stdout" "$deploy_stderr" | tail -n 12 | while IFS= read -r line; do
              line="${line//$VERCEL_TOKEN/***}"
              line="${line//$VITE_SUPABASE_ANON_KEY/***}"
              line="${line//::/: :}"
              [[ -z "$line" ]] || echo "::error::${line:0:400}"
            done
            exit "$deploy_status"
          fi
          # JSON output exposes the immutable deployment URL separately from
          # Vercel's production alias, independent of CLI terminal formatting.
          deploy_url="$(node -e 'const fs=require("node:fs");const r=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));const u=r.deployment?.url??r.url;if(typeof u!=="string"||!u)process.exit(1);console.log(/^https?:\/\//.test(u)?u:`https://${u}`)' "$deploy_stdout" 2>/dev/null || true)"
          if [[ -z "$deploy_url" || "$deploy_url" != https://* ]]; then
            echo "::error::Vercel deploy succeeded but JSON did not contain a valid deployment URL."
            cat "$deploy_stdout"
            exit 1
          fi
          echo "Prebuilt Vercel deployment created: ${deploy_url}"
          echo "VERCEL_DEPLOYMENT_URL=${deploy_url}" >> "$GITHUB_ENV"
          echo "FRONTEND_URL=${FRONTEND_LIVE_URL%/}" >> "$GITHUB_ENV"
      # IC 2026-09-25 P9: evidence that the LIVE frontend is this commit and
      # expects this migration target (compatibility with the DB just verified).
      - name: Verify deployed frontend version (staging)
        id: frontend_verify
        if: ${{ always() && !cancelled() && steps.frontend.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          live_url="${FRONTEND_URL:-}"
          deployment_url="${VERCEL_DEPLOYMENT_URL:-}"
          [[ -n "$deployment_url" ]] || { echo "::error::Vercel did not return a deployment URL; cannot verify the built frontend."; exit 1; }
          [[ -n "$live_url" ]] || { echo "::error::No live frontend URL is configured; refusing to report an unverified release."; exit 1; }
          deployment_url="${deployment_url%/}"
          live_url="${live_url%/}"
          check_frontend_version() {
            local label="$1" url="$2" body commit target
            body="$(curl -fsSL --max-time 30 --retry 5 --retry-delay 2 --retry-all-errors -H 'Cache-Control: no-cache' "${url}/version.json?release_check=${GITHUB_RUN_ID}" || true)"
            if [[ -z "$body" ]] || ! printf '%s' "$body" | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{try{JSON.parse(d)}catch{process.exit(1)}})'; then
              echo "::error::${label} ${url}/version.json is unavailable or invalid."
              return 1
            fi
            commit="$(printf '%s' "$body" | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{const j=JSON.parse(d);console.log(j.commit ?? "")})')"
            target="$(printf '%s' "$body" | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{const j=JSON.parse(d);console.log(j.migrationTarget ?? "")})')"
            echo "${label}: commit=${commit} migrationTarget=${target}"
            if [[ "$commit" != "$GITHUB_SHA" || "$target" != "$MIGRATION_TARGET" ]]; then
              echo "::error::${label} reports commit=${commit} migrationTarget=${target}; expected ${GITHUB_SHA} / ${MIGRATION_TARGET}."
              return 1
            fi
            echo "${label} verified at the expected commit and migration target."
          }
          # The immutable deployment URL can be access-protected by Vercel and
          # return an auth page to plain curl. The exact prebuilt artifact was
          # already validated before migration; verify the public canonical URL
          # users actually visit, which is the release acceptance criterion.
          echo "::notice::Prebuilt Vercel deployment: ${deployment_url}; checking the canonical ${SUPABASE_ENV_LABEL} URL."
          if ! check_frontend_version "Canonical ${SUPABASE_ENV_LABEL} URL" "$live_url"; then
            echo "::error::The prebuilt artifact was validated before migration, but the canonical live URL is not serving it; check the Vercel production alias/domain."
            exit 1
          fi
      - name: Release manifest (staging)
        if: always()
        shell: bash
        env:
          ENV_LABEL: staging
          OUT_MIGRATE: ${{ steps.migrate.outcome }}
          OUT_VERIFY: ${{ steps.verify_migration.outcome }}
          OUT_EDGE: ${{ steps.edge.outcome }}
          OUT_FRONTEND: ${{ steps.frontend.outcome }}
          OUT_FRONTEND_VERIFY: ${{ steps.frontend_verify.outcome }}
        run: node scripts/ci/release-manifest.mjs
      - name: Upload release manifest (staging)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-manifest-staging
          path: artifacts/release/release-manifest.json
          if-no-files-found: warn

  # =========================================================================
  # PRODUCTION — only on a `v*` tag, behind a manual approval gate
  # =========================================================================
  deploy-production:
    name: Deploy to production
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.environment == 'production')
    runs-on: ubuntu-latest
    environment:
      name: Production
      url: ${{ vars.PRODUCTION_URL }}
    env:
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID_PROD }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      FRONTEND_LIVE_URL: ${{ vars.PRODUCTION_URL }}

      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL_PROD }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY_PROD }}
      VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN_PROD }}
      # Org capability kill switch; default OFF until the gated rollout opts in.
      VITE_FEATURE_CAPABILITY_ORG_LAYER: ${{ vars.VITE_FEATURE_CAPABILITY_ORG_LAYER_PROD || 'false' }}

      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ vars.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT_PROD }}

      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF_PROD }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD_PROD }}
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      # Used only to name the missing secret in pre-flight error messages.
      SUPABASE_SECRET_SUFFIX: PROD
      SUPABASE_ENV_LABEL: production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      # IC 2026-09-25 P9: the DB migration this commit expects (verified on the
      # remote before the frontend ships; embedded in /version.json).
      - name: Record migration target
        run: echo "MIGRATION_TARGET=$(node scripts/ci/migration-target.mjs)" >> "$GITHUB_ENV"
      - name: Build frontend
        id: build
        run: npm run build
      - name: Deploy Supabase backend (production)
        uses: supabase/setup-cli@v3
        with:
          version: 2.109.0
      - name: Verify Supabase credentials are configured (production)
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || {
            echo "::error::SUPABASE_ACCESS_TOKEN is not configured. Add it under Settings -> Secrets and variables -> Actions."
            exit 1
          }
          test -n "$SUPABASE_PROJECT_REF" || {
            echo "::error::SUPABASE_PROJECT_REF_${SUPABASE_SECRET_SUFFIX} is not configured. Add it under Settings -> Secrets and variables -> Actions -> Variables."
            exit 1
          }
          test -n "$SUPABASE_DB_PASSWORD" || {
            echo "::error::SUPABASE_DB_PASSWORD_${SUPABASE_SECRET_SUFFIX} is not configured. Add the ${SUPABASE_ENV_LABEL} Supabase database password under Settings -> Secrets and variables -> Actions."
            exit 1
          }
          if [[ "$SUPABASE_DB_PASSWORD" == *$'\n'* || "$SUPABASE_DB_PASSWORD" == *$'\r'* ]]; then
            echo "::error::SUPABASE_DB_PASSWORD_${SUPABASE_SECRET_SUFFIX} must not contain a newline."
            exit 1
          fi
          echo "Supabase deployment credentials for ${SUPABASE_ENV_LABEL} are configured."
      # ORDER MATTERS: the database is migrated (and the functions deployed)
      # BEFORE the frontend goes live. The client writes columns and calls
      # functions that only exist after `supabase db push` — e.g.
      # journal_entries.posting_key, added by 20260921000000 — so shipping it
      # first leaves a window where new code writes against an old schema.
      # Backend-first is the safe direction: the migrations are additive, so
      # the running (old) client keeps working throughout the rollout.
      # IC 2026-09-25 P9: fail BEFORE the irreversible DB migration when the
      # frontend cannot possibly be deployed (missing/invalid Vercel token or
      # project). On 2026-09-24 the backend shipped and Vercel then failed,
      # leaving ~23.5 h of new-backend/old-frontend skew.
      - name: Pre-flight frontend deploy credentials (production)
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}" || { echo "::error::VERCEL_TOKEN is not configured; refusing to migrate the database without a deployable frontend."; exit 1; }
          test -n "${VERCEL_PROJECT_ID:-}" || { echo "::error::Vercel project id for production is not configured; refusing to migrate."; exit 1; }
          test -n "${VERCEL_ORG_ID:-}" || { echo "::error::VERCEL_ORG_ID is not configured; refusing to migrate."; exit 1; }
          test -n "${FRONTEND_LIVE_URL:-}" || { echo "::error::PRODUCTION_URL is not configured; refusing to migrate without a verifiable live frontend URL."; exit 1; }
          [[ "$FRONTEND_LIVE_URL" == https://* ]] || { echo "::error::PRODUCTION_URL must be an https URL."; exit 1; }
          npm i -g vercel@latest >/dev/null 2>&1
          if ! vercel whoami --token "$VERCEL_TOKEN" >/dev/null 2>&1; then
            echo "::error::Vercel token rejected (vercel whoami failed); refusing to migrate the database."
            exit 1
          fi
          # Link the exact production project before the irreversible DB step.
          if ! vercel link --yes --project "$VERCEL_PROJECT_ID" --scope "$VERCEL_ORG_ID" --token "$VERCEL_TOKEN"; then
            echo "::error::Could not link the configured production Vercel project; refusing to migrate."
            exit 1
          fi
          if ! vercel pull --yes --environment=production --scope "$VERCEL_ORG_ID" --token "$VERCEL_TOKEN"; then
            echo "::error::Could not pull production Vercel project settings; refusing to migrate."
            exit 1
          fi
          export VITE_APP_VERSION="$GITHUB_SHA"
          export VITE_MIGRATION_TARGET="$MIGRATION_TARGET"
          vercel_build_log="$(mktemp)"
          set +e
          vercel build --prod --scope "$VERCEL_ORG_ID" --token "$VERCEL_TOKEN" 2>&1 | tee "$vercel_build_log"
          vercel_build_status=${PIPESTATUS[0]}
          set -e
          if [[ "$vercel_build_status" -ne 0 ]]; then
            echo "::error::Vercel production build failed before database migration (exit ${vercel_build_status})."
            tail -n 8 "$vercel_build_log" | while IFS= read -r line; do
              line="${line//$VERCEL_TOKEN/***}"
              line="${line//$VITE_SUPABASE_ANON_KEY/***}"
              [[ -z "$line" ]] || echo "::error::${line//::/: :}"
            done
            exit "$vercel_build_status"
          fi
          version_file=".vercel/output/static/version.json"
          [[ -s "$version_file" ]] || { echo "::error::Vercel build did not produce ${version_file}; refusing to migrate."; exit 1; }
          if ! version_values="$(node -e 'const fs=require("node:fs");const v=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));console.log(v.commit ?? "", v.migrationTarget ?? "")' "$version_file")"; then
            echo "::error::Vercel build produced invalid version.json; refusing to migrate."
            exit 1
          fi
          read -r built_commit built_target <<< "$version_values"
          if [[ "$built_commit" != "$GITHUB_SHA" || "$built_target" != "$MIGRATION_TARGET" ]]; then
            echo "::error::Vercel build artifact has commit=${built_commit} migrationTarget=${built_target}; expected ${GITHUB_SHA} / ${MIGRATION_TARGET}. Refusing to migrate."
            exit 1
          fi
          echo "Vercel credentials valid; linked production project ${VERCEL_PROJECT_ID}; prebuilt artifact verified."
      - name: Link & migrate production database
        id: migrate
        shell: bash
        # Same shared script the staging job uses: project-status pre-flight,
        # retries around link/push, and migration-history drift repair (a
        # remote-only version no longer aborts the deploy — the script marks
        # it reverted per the CLI's own guidance and re-pushes). See script
        # header and DEPLOYMENT.md.
        env:
          SUPABASE_ENV_LABEL: production
        run: bash scripts/ci/supabase-link-and-push.sh
      - name: Verify DB reached migration target (production)
        id: verify_migration
        shell: bash
        run: bash scripts/ci/verify-migration-target.sh
      - name: Set Edge Function secrets (production)
        run: |
          supabase secrets set \
            SB_ENV="production" \
            SENTRY_DSN="${{ secrets.SENTRY_DSN_BACKEND_PROD }}" \
            SENDGRID_API_KEY="${{ secrets.SENDGRID_API_KEY_PROD }}" \
            SENDGRID_FROM_EMAIL="${{ secrets.SENDGRID_FROM_EMAIL_PROD }}" \
            ANTHROPIC_API_KEY="${{ secrets.ANTHROPIC_API_KEY_PROD }}" \
            PAYCHANGU_SECRET_KEY="${{ secrets.PAYCHANGU_SECRET_KEY_PROD }}" \
            PAYCHANGU_WEBHOOK_SECRET="${{ secrets.PAYCHANGU_WEBHOOK_SECRET_PROD }}" \
            INVOICE_TRACKING_SECRET="${{ secrets.INVOICE_TRACKING_SECRET_PROD }}" \
            ALLOWED_ORIGINS="${{ vars.ALLOWED_ORIGINS_PROD }}" \
            APP_URL="${{ vars.APP_URL_PROD }}" \
            CRON_SECRET="${{ secrets.CRON_SECRET_PROD }}" \
            --project-ref "$SUPABASE_PROJECT_REF"
      - name: Deploy Edge Functions (production)
        id: edge
        run: |
          for dir in supabase/functions/[a-z]*/; do
            fn="$(basename "$dir")"
            echo "Deploying function: $fn"
            if ! supabase functions deploy "$fn" --no-verify-jwt --project-ref "$SUPABASE_PROJECT_REF"; then
              echo "::error::supabase functions deploy failed for ${fn}"
              exit 1
            fi
          done
      # See the staging note: without this the cron jobs keep posting to
      # 'https://<PROJECT_REF>.supabase.co/...' and never fire.
      - name: Reschedule pg_cron jobs with real URLs (production)
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET_PROD }}
        run: bash scripts/ci/apply-cron-jobs.sh
      - name: Deploy Express gateway to Railway (if configured)
        if: env.RAILWAY_TOKEN != ''
        env:
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID_PROD }}
        run: |
          npm i -g @railway/cli
          railway up --service ledgr-gateway --environment production

      # Backend compatibility-critical steps must succeed before this deploy,
      # but independent maintenance (pg_cron / optional Railway) must not strand
      # users on the previous frontend after the DB and functions have shipped.
      - name: Deploy frontend to Vercel (production)
        id: frontend
        if: >-
          ${{ always() && !cancelled() &&
              steps.build.outcome == 'success' &&
              steps.migrate.outcome == 'success' &&
              steps.verify_migration.outcome == 'success' &&
              steps.edge.outcome == 'success' }}
        run: |
          set -euo pipefail
          deploy_stdout="$(mktemp)"
          deploy_stderr="$(mktemp)"
          set +e
          vercel deploy --prebuilt \
            --prod \
            --token "$VERCEL_TOKEN" \
            --scope "$VERCEL_ORG_ID" \
            --yes \
            --json \
            --force \
            >"$deploy_stdout" 2>"$deploy_stderr"
          deploy_status=$?
          set -e
          if [[ -s "$deploy_stderr" ]]; then
            cat "$deploy_stderr"
          fi
          if [[ "$deploy_status" -ne 0 ]]; then
            echo "::error::vercel deploy --prebuilt (production) failed (exit ${deploy_status})"
            cat "$deploy_stdout" "$deploy_stderr" | tail -n 12 | while IFS= read -r line; do
              line="${line//$VERCEL_TOKEN/***}"
              line="${line//$VITE_SUPABASE_ANON_KEY/***}"
              line="${line//::/: :}"
              [[ -z "$line" ]] || echo "::error::${line:0:400}"
            done
            exit "$deploy_status"
          fi
          # JSON output exposes the immutable deployment URL separately from
          # Vercel's production alias, independent of CLI terminal formatting.
          deploy_url="$(node -e 'const fs=require("node:fs");const r=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));const u=r.deployment?.url??r.url;if(typeof u!=="string"||!u)process.exit(1);console.log(/^https?:\/\//.test(u)?u:`https://${u}`)' "$deploy_stdout" 2>/dev/null || true)"
          if [[ -z "$deploy_url" || "$deploy_url" != https://* ]]; then
            echo "::error::Vercel deploy succeeded but JSON did not contain a valid deployment URL."
            cat "$deploy_stdout"
            exit 1
          fi
          echo "Prebuilt Vercel deployment created: ${deploy_url}"
          echo "VERCEL_DEPLOYMENT_URL=${deploy_url}" >> "$GITHUB_ENV"
          echo "FRONTEND_URL=${FRONTEND_LIVE_URL%/}" >> "$GITHUB_ENV"
      # IC 2026-09-25 P9: evidence that the LIVE frontend is this commit and
      # expects this migration target (compatibility with the DB just verified).
      - name: Verify deployed frontend version (production)
        id: frontend_verify
        if: ${{ always() && !cancelled() && steps.frontend.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          live_url="${FRONTEND_URL:-}"
          deployment_url="${VERCEL_DEPLOYMENT_URL:-}"
          [[ -n "$deployment_url" ]] || { echo "::error::Vercel did not return a deployment URL; cannot verify the built frontend."; exit 1; }
          [[ -n "$live_url" ]] || { echo "::error::No live frontend URL is configured; refusing to report an unverified release."; exit 1; }
          deployment_url="${deployment_url%/}"
          live_url="${live_url%/}"
          check_frontend_version() {
            local label="$1" url="$2" body commit target
            body="$(curl -fsSL --max-time 30 --retry 5 --retry-delay 2 --retry-all-errors -H 'Cache-Control: no-cache' "${url}/version.json?release_check=${GITHUB_RUN_ID}" || true)"
            if [[ -z "$body" ]] || ! printf '%s' "$body" | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{try{JSON.parse(d)}catch{process.exit(1)}})'; then
              echo "::error::${label} ${url}/version.json is unavailable or invalid."
              return 1
            fi
            commit="$(printf '%s' "$body" | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{const j=JSON.parse(d);console.log(j.commit ?? "")})')"
            target="$(printf '%s' "$body" | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{const j=JSON.parse(d);console.log(j.migrationTarget ?? "")})')"
            echo "${label}: commit=${commit} migrationTarget=${target}"
            if [[ "$commit" != "$GITHUB_SHA" || "$target" != "$MIGRATION_TARGET" ]]; then
              echo "::error::${label} reports commit=${commit} migrationTarget=${target}; expected ${GITHUB_SHA} / ${MIGRATION_TARGET}."
              return 1
            fi
            echo "${label} verified at the expected commit and migration target."
          }
          # The immutable deployment URL can be access-protected by Vercel and
          # return an auth page to plain curl. The exact prebuilt artifact was
          # already validated before migration; verify the public canonical URL
          # users actually visit, which is the release acceptance criterion.
          echo "::notice::Prebuilt Vercel deployment: ${deployment_url}; checking the canonical ${SUPABASE_ENV_LABEL} URL."
          if ! check_frontend_version "Canonical ${SUPABASE_ENV_LABEL} URL" "$live_url"; then
            echo "::error::The prebuilt artifact was validated before migration, but the canonical live URL is not serving it; check the Vercel production alias/domain."
            exit 1
          fi
      - name: Release manifest (production)
        if: always()
        shell: bash
        env:
          ENV_LABEL: production
          OUT_MIGRATE: ${{ steps.migrate.outcome }}
          OUT_VERIFY: ${{ steps.verify_migration.outcome }}
          OUT_EDGE: ${{ steps.edge.outcome }}
          OUT_FRONTEND: ${{ steps.frontend.outcome }}
          OUT_FRONTEND_VERIFY: ${{ steps.frontend_verify.outcome }}
        run: node scripts/ci/release-manifest.mjs
      - name: Upload release manifest (production)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-manifest-production
          path: artifacts/release/release-manifest.json
          if-no-files-found: warn
