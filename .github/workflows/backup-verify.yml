name: Backup Verification

# ---------------------------------------------------------------------------
# Weekly automated backup-restore test.
#
# Restores a logical dump of the selected Supabase database into a *throwaway*
# Postgres container, then compares row counts of core tables between the live
# source and the restored copy. Any mismatch (or failure to restore) fails the
# run so we know the backup path is usable before it is needed.
#
# The workflow deliberately reuses the per-environment project ref, database
# password, and Supabase access token already used by deploy.yml. `supabase
# link` resolves the project's session-pooler endpoint, so no duplicate
# SUPABASE_DB_URL_* secret (and no password embedded in a URL) is required.
# ---------------------------------------------------------------------------

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      environment:
        description: Which environment's backup to verify
        required: true
        default: production
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read

concurrency:
  # Do not run two large logical dumps against the same environment at once.
  group: backup-verification-${{ github.event.inputs.environment || 'production' }}
  cancel-in-progress: false

jobs:
  verify-backup:
    name: Restore & verify backup
    runs-on: ubuntu-latest

    # Resolve environment-scoped credentials as well as repository credentials.
    # Scheduled runs always verify Production; manual runs may select staging.
    environment:
      name: ${{ github.event.inputs.environment == 'staging' && 'staging' || 'Production' }}

    # Throwaway Postgres instance used only for the duration of this job. The
    # Supabase projects are PostgreSQL 17, so use the same major for restore.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: throwaway
          POSTGRES_PASSWORD: throwaway
          POSTGRES_DB: restore
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U throwaway"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TARGET_ENV: ${{ github.event.inputs.environment || 'production' }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      # Keep both sets separate until the shell selects TARGET_ENV. This avoids
      # GitHub expression `&& ... || ...` fall-through selecting Production when
      # a staging value is intentionally empty or misconfigured.
      STAGING_SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF_STAGING }}
      PROD_SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF_PROD }}
      STAGING_SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD_STAGING }}
      PROD_SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD_PROD }}

      RESTORE_DB_URL: "postgresql://throwaway:throwaway@localhost:5432/restore"
      # Core tables whose row counts must match exactly. Comma-separated.
      # Every name must exist as a migration-created table: payroll employees
      # live in `employees`, inventory stock in `inventory_balances`, and
      # billing records in `subscription_payments` (`payroll_employees`,
      # `inventory_items` and `subscriptions` do not exist in the migrations).
      # Tables absent from the source schema are skipped with a warning.
      TABLES: >-
        businesses,business_users,contacts,accounts,invoices,expenses,
        journal_entries,journal_lines,employees,tax_returns,
        inventory_balances,branches,departments,api_keys,webhooks,subscription_payments

    steps:
      - uses: actions/checkout@v7

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.109.0

      - name: Use PostgreSQL 17 client
        shell: bash
        run: |
          set -euo pipefail
          pg_bin=/usr/lib/postgresql/17/bin
          if [[ ! -x "$pg_bin/pg_dump" || ! -x "$pg_bin/pg_restore" || ! -x "$pg_bin/psql" ]]; then
            # Ubuntu's default repositories may not carry this major version.
            # Register the official PGDG repository with a repository-scoped
            # signing key before requesting the versioned client package.
            sudo apt-get update
            sudo apt-get install -y ca-certificates curl
            sudo install -d -m 0755 /usr/share/postgresql-common/pgdg
            curl --fail --silent --show-error --location --retry 3 \
              https://www.postgresql.org/media/keys/ACCC4CF8.asc \
              | sudo tee /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc > /dev/null
            . /etc/os-release
            echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" \
              | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
            sudo apt-get update
            sudo apt-get install -y postgresql-client-17
          fi
          for tool in pg_dump pg_restore psql; do
            test -x "$pg_bin/$tool"
            "$pg_bin/$tool" --version | grep -E 'PostgreSQL\) 17\.'
          done
          echo "$pg_bin" >> "$GITHUB_PATH"

      - name: Resolve source database connection
        shell: bash
        run: |
          set -euo pipefail

          case "$TARGET_ENV" in
            staging)
              project_ref="$STAGING_SUPABASE_PROJECT_REF"
              db_password="$STAGING_SUPABASE_DB_PASSWORD"
              config_suffix=STAGING
              ;;
            production)
              project_ref="$PROD_SUPABASE_PROJECT_REF"
              db_password="$PROD_SUPABASE_DB_PASSWORD"
              config_suffix=PROD
              ;;
            *)
              echo "::error::Unsupported backup environment: $TARGET_ENV"
              exit 1
              ;;
          esac

          test -n "$SUPABASE_ACCESS_TOKEN" || {
            echo "::error::SUPABASE_ACCESS_TOKEN is not configured. It is required to resolve the Supabase pooler endpoint."
            exit 1
          }
          test -n "$project_ref" || {
            echo "::error::SUPABASE_PROJECT_REF_${config_suffix} is not configured."
            exit 1
          }
          test -n "$db_password" || {
            echo "::error::SUPABASE_DB_PASSWORD_${config_suffix} is not configured."
            exit 1
          }
          if [[ "$db_password" == *$'\n'* || "$db_password" == *$'\r'* ]]; then
            echo "::error::SUPABASE_DB_PASSWORD_${config_suffix} must not contain a newline."
            exit 1
          fi

          # `link` discovers the current, project-specific IPv4 session pooler
          # and writes an uncredentialed URL to supabase/.temp/pooler-url.
          # This is the same supported credential path used by deploy.yml.
          echo "::add-mask::$db_password"
          supabase link --project-ref "$project_ref" --password "$db_password"

          pooler_url_file=supabase/.temp/pooler-url
          test -s "$pooler_url_file" || {
            echo "::error::Supabase did not return a session-pooler URL for ${TARGET_ENV}. Check that SUPABASE_ACCESS_TOKEN can read this project's database pooler configuration."
            exit 1
          }
          source_db_url="$(tr -d '\r\n' < "$pooler_url_file")"
          case "$source_db_url" in
            postgres://*|postgresql://*) ;;
            *)
              echo "::error::Supabase returned an invalid database pooler URL."
              exit 1
              ;;
          esac

          # Keep the password separate from the endpoint: libpq reads it through
          # PGPASSWORD in verify-backup.sh, and TLS is required for the source.
          {
            printf 'SOURCE_DB_URL=%s\n' "$source_db_url"
            printf 'SOURCE_DB_PASSWORD=%s\n' "$db_password"
            printf 'SOURCE_DB_SSLMODE=require\n'
          } >> "$GITHUB_ENV"
          echo "Resolved the ${TARGET_ENV} session-pooler endpoint using existing deployment credentials."

      - name: Restore backup and compare row counts
        run: bash scripts/verify-backup.sh
