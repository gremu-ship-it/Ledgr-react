# ============================================================================
# Repair: Eagle Nova Horizon chicken-manure double-count (160 → 320)
# ============================================================================
# Runs scripts/repair-eagle-nova-double-count.sql against the PRODUCTION
# Supabase project over the Management API (same SUPABASE_ACCESS_TOKEN the
# deploy workflow already uses — no database password needed).
#
# TRIGGERS
#   * push to main when this workflow or the SQL file changes → runs the
#     FULL repair (DRY_RUN=0). The SQL is double-guarded (exact business +
#     product + pure double-count signature + optimistic re-check) and
#     idempotent, so an auto-run is safe; a no-op re-run just logs
#     "REPAIR no-op".
#   * workflow_dispatch → dry_run input (default true) for a read-only
#     diagnosis first, or dry_run=false to force the repair.
#
# SAFETY
#   * Production isolation: hard-fails if SUPABASE_PROJECT_REF_PROD equals
#     SUPABASE_PROJECT_REF_STAGING or is empty.
#   * The repair DO block only updates inventory_balances rows matching
#     quantity_on_hand=320 AND ledger_quantity=160 for Eagle Nova's
#     chicken-manure product — never stock_movements, never journals.
#   * Never writes quantity_available on the production GENERATED column.
#
# RESULTS VISIBILITY
#   Job logs/artifacts live on Azure Blob Storage, which some networks cannot
#   reach (SSL reset). Every result line is therefore also emitted as a
#   check-run annotation (`::notice …`), readable via the GitHub API.
#
# USAGE
#   Auto: merge a change to scripts/repair-eagle-nova-double-count.sql.
#   Manual: Actions → "Repair Eagle Nova chicken-manure double-count"
#           → Run workflow → dry_run=true|false.
# ============================================================================
name: Repair Eagle Nova chicken-manure double-count

on:
  push:
    branches: [main]
    paths:
      - scripts/repair-eagle-nova-double-count.sql
      - scripts/diagnose-eagle-nova-chicken-manure.sql
      - scripts/diagnose-eagle-nova-area49.sql
      - scripts/database/run-support-sql-via-api.sh
      - .github/workflows/repair-eagle-nova-double-count.yml
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true = diagnostics only (SELECTs); false = also run the repair"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      ref:
        description: Branch/ref containing this workflow + SQL
        required: false
        default: ""

permissions:
  contents: read
  actions: write   # upload the run output as an artifact
  checks: write    # annotations carrying the diagnosis/repair/verify lines

concurrency:
  group: repair-eagle-nova-double-count
  cancel-in-progress: false

jobs:
  repair:
    name: Repair chicken-manure double-count (production)
    runs-on: ubuntu-latest
    environment: Production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF_PROD }}
      PRODUCTION_SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF_PROD }}
      STAGING_SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF_STAGING }}
      # push → full repair; dispatch → honour the dry_run input (default true)
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || '0' }}
      SQL_FILE: scripts/diagnose-eagle-nova-area49.sql
      OUT_DIR: artifacts/support-sql
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Verify environment isolation + credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "::error::SUPABASE_ACCESS_TOKEN is not configured."; exit 1; }
          test -n "$SUPABASE_PROJECT_REF"   || { echo "::error::SUPABASE_PROJECT_REF_PROD is not configured."; exit 1; }
          test -n "$STAGING_SUPABASE_PROJECT_REF" || { echo "::error::SUPABASE_PROJECT_REF_STAGING is not configured (isolation check needs it)."; exit 1; }
          if [[ "$SUPABASE_PROJECT_REF" == "$STAGING_SUPABASE_PROJECT_REF" ]]; then
            echo "::error::ENVIRONMENT ISOLATION FAILURE — production ref equals staging ref. Not connecting."
            exit 1
          fi
          test -f "$SQL_FILE" || { echo "::error::Missing $SQL_FILE"; exit 1; }
          chmod +x scripts/database/run-support-sql-via-api.sh
          echo "Isolation OK: targeting production ref ${SUPABASE_PROJECT_REF} (distinct from staging)."
          echo "Mode: DRY_RUN=${DRY_RUN} (event=${GITHUB_EVENT_NAME})"

      - name: Run support SQL (Management API)
        shell: bash
        run: bash scripts/database/run-support-sql-via-api.sh

      - name: Show results
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          echo "==== run.log ===="
          cat "${OUT_DIR}/run.log" || true
          for f in "${OUT_DIR}"/stmt-*.txt; do
            [[ -e "$f" ]] || continue
            echo "==== ${f} ===="
            cat "$f"
          done
          # Step summary for the Actions UI.
          {
            echo "## Eagle Nova chicken-manure repair (DRY_RUN=${DRY_RUN})"
            echo ""
            echo '```'
            cat "${OUT_DIR}/run.log" 2>/dev/null || true
            for f in "${OUT_DIR}"/stmt-*.txt; do
              [[ -e "$f" ]] || continue
              echo "---- ${f} ----"
              cat "$f"
            done
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

          # Annotations → check-run API (reachable when Azure blobs are not).
          # Keep each message single-line and under the annotation size cap.
          while IFS= read -r line || [[ -n "$line" ]]; do
            [[ -n "${line//[[:space:]]/}" ]] || continue
            safe="$(printf '%s' "$line" | tr '\r\n\t' '   ' | cut -c1-6000)"
            echo "::notice title=Eagle Nova repair::${safe}"
          done < <(cat "${OUT_DIR}"/run.log "${OUT_DIR}"/stmt-*.txt 2>/dev/null || true)

      - name: Upload run output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eagle-nova-double-count-repair
          path: artifacts/support-sql/
          if-no-files-found: warn
