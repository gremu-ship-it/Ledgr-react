name: CI

# Runs on every pull request (and on pushes to main) and verifies the code the
# way a developer would locally, via the `verify` script plus the new unit
# tests. This replaces the old "NodeJS with Webpack" workflow, which ran
# `npx webpack` on a Vite project with no webpack dependency and failed on
# every push.
#
# Gate policy (see deploy.yml for the deployment half of the pipeline):
#   * pull_request  -> typecheck + lint + unit tests + build
#   * push main     -> same checks (acts as the pre-deploy safety net)

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, test & build
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Node 18 is intentionally absent: vite@8 requires
        # ^20.19.0 || >=22.12.0, so an 18.x leg can never pass.
        node-version: [22.x]

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Build
        # Vite reads these at build time and bakes them into the client bundle.
        # They are publishable values, not secrets, but CI has no project to
        # point at — placeholders keep the build honest without wiring up an
        # environment. src/lib/supabase.ts throws if they are absent. The real
        # values for each environment are injected at deploy time (see
        # deploy.yml) and configured in the Vercel project.
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder-anon-key
        run: npm run build

  release-evidence:
    name: Isolated release evidence (R13)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # No deployment environment, secrets, external database or provider credentials.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm
      - name: Install locked test tooling without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Hydrate packaged PostgreSQL symlinks (Linux runner only)
        run: npm rebuild @embedded-postgres/linux-x64
      - name: Typecheck release harness
        run: npm run test:release:types
      - name: Run isolated release evidence
        # FAIL and BLOCKED both return nonzero. No continue-on-error or expected-failure masking.
        run: npm run test:release
      - name: Retain sanitized evidence, including failures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: r13-local-evidence
          path: .cache/r13/ledgr-r13-*/evidence.json
          if-no-files-found: error
          retention-days: 7
