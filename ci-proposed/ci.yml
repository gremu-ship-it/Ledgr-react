name: CI

# Replaces the old "NodeJS with Webpack" workflow, which ran `npx webpack` on a
# Vite project with no webpack dependency and no webpack config — it failed on
# every push and told us nothing about the code. This runs the checks the
# project actually has: typecheck, lint and a production build.

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck, lint and build
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Node 18 is intentionally absent: vite@8 requires
        # ^20.19.0 || >=22.12.0, so an 18.x leg can never pass.
        node-version: [20.x, 22.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc -b

      - name: Lint
        run: npm run lint

      - name: Build
        # Vite requires these at build time; the values are baked into the
        # client bundle and are not secret, but CI has no project to point at,
        # so placeholders keep the build honest without wiring up a real env.
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder-anon-key
        run: npm run build
